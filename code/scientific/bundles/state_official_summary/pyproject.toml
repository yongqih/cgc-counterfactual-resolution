[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "igc-virtual-cell"
version = "0.1.0"
description = "Minimal auditable prototype for IGC-guided Virtual Cell data audits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anndata>=0.13",
  "aiohttp>=3.14",
  "h5py>=3.16",
  "fsspec>=2025.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
    "zarr>=3.1",
    "python-igraph>=1.0",
    "leidenalg>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]
phase2 = ["torch>=2.11"]

[project.scripts]
igc-audit = "igc_virtual_cell.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
